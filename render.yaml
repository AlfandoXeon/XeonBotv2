services:
  - type: web
    name: xeon-whatsapp-bot
    runtime: docker
    plan: free
    healthCheckPath: /health
    envVars:
      - key: TZ
        value: Asia/Jakarta
      - key: PORT
        value: 8080
      - key: WEB_PASSWORD
        sync: false
      - key: DATABASE_URL
        sync: false
